<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZeroPulse // Zero-Trust IoMT Gateway</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #060b19;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
        }
        .card-bg {
            background-color: #0d1527;
            border: 1px solid #1e293b;
        }
        .custom-scroll::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: #090f1d;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #1e3a8a;
            border-radius: 3px;
        }
    </style>
</head>
<body class="text-slate-200 min-h-screen p-8">

    <!-- Global Header with ZeroPulse Logo -->
    <header class="max-w-7xl mx-auto flex items-center justify-between pb-6 mb-8 border-b border-blue-950">
        <div class="flex items-center gap-3.5">
            <!-- Inline SVG Cyber Shield & Pulse Logo -->
            <div class="p-2 rounded-lg bg-cyan-950/40 border border-cyan-500/40 shadow-sm shadow-cyan-900/30 flex items-center justify-center">
                <svg class="w-8 h-8 text-cyan-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    <path d="M7 12h2.5l1.5-3 2 6 1.5-3H17" class="text-emerald-400" stroke="currentColor"/>
                </svg>
            </div>
            <div>
                <h1 class="text-2xl font-bold tracking-wide text-cyan-400 uppercase">
                    ZEROPULSE // ZERO-TRUST IoMT GATEWAY
                </h1>
                <p class="text-xs text-slate-400 mt-0.5">Real-Time Clinical Telemetry & Heuristic Threat Containment</p>
            </div>
        </div>
        <div>
            <span id="socket-status" class="px-3 py-1 text-xs font-mono font-semibold rounded bg-slate-900 border border-slate-700 text-slate-400">
                CONNECTING...
            </span>
        </div>
    </header>

    <!-- Main Dashboard Grid -->
    <main class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- Left Column: Device Inventory -->
        <section class="lg:col-span-4 flex flex-col gap-4">
            <h2 class="text-xs font-bold tracking-wider text-slate-300 uppercase">Registered IoMT Nodes</h2>
            <div id="device-container" class="flex flex-col gap-3"></div>
        </section>

        <!-- Center Column: Live Ingested Telemetry -->
        <section class="lg:col-span-4 flex flex-col gap-4">
            <h2 class="text-xs font-bold tracking-wider text-slate-300 uppercase">Ingested Telemetry Stream</h2>
            <div class="card-bg rounded-lg p-3 flex-1">
                <div id="telemetry-logs" class="custom-scroll h-[520px] overflow-y-auto space-y-2 text-xs font-mono"></div>
            </div>
        </section>

        <!-- Right Column: Incident & Containment Log -->
        <section class="lg:col-span-4 flex flex-col gap-4">
            <h2 class="text-xs font-bold tracking-wider text-rose-400 uppercase">Security Alerts & Isolation Events</h2>
            <div class="card-bg rounded-lg p-3 flex-1">
                <div id="alert-logs" class="custom-scroll h-[520px] overflow-y-auto space-y-3 text-xs font-mono">
                    <p id="no-alerts" class="text-slate-500 italic p-2">No security incidents detected.</p>
                </div>
            </div>
        </section>

    </main>

    <script>
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const host = window.location.host;
        const wsUrl = `${protocol}//${host}/ws/events`;
        let ws;

        function connect() {
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                const badge = document.getElementById("socket-status");
                badge.textContent = "SOCKET: ACTIVE";
                badge.className = "px-3 py-1 text-xs font-mono font-semibold rounded bg-emerald-950/60 border border-emerald-500/50 text-emerald-400";
                loadDevices();
            };

            ws.onclose = () => {
                const badge = document.getElementById("socket-status");
                badge.textContent = "SOCKET: DISCONNECTED";
                badge.className = "px-3 py-1 text-xs font-mono font-semibold rounded bg-rose-950/60 border border-rose-500/50 text-rose-400";
                setTimeout(connect, 2000);
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleEvent(data);
            };
        }

        async function loadDevices() {
            try {
                const res = await fetch("/api/v1/devices");
                const devices = await res.json();
                renderDevices(devices);
            } catch (err) {
                console.error("Error fetching devices:", err);
            }
        }

        function renderDevices(devices) {
            const container = document.getElementById("device-container");
            container.innerHTML = "";

            Object.entries(devices).forEach(([id, dev]) => {
                const isQuarantined = dev.status === "QUARANTINED";
                
                const card = document.createElement("div");
                card.className = `p-4 rounded-lg border transition-all ${
                    isQuarantined ? "bg-rose-950/20 border-rose-600/60" : "card-bg"
                }`;

                card.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div>
                            <div class="font-bold text-sm text-slate-100">${dev.name}</div>
                            <div class="text-xs font-mono text-slate-400">${id} • ${dev.type}</div>
                        </div>
                        <span class="px-2 py-0.5 text-xs font-bold rounded uppercase ${
                            isQuarantined ? "bg-rose-500 text-white" : "bg-emerald-950/80 text-emerald-400 border border-emerald-600/40"
                        }">
                            ${dev.status}
                        </span>
                    </div>
                    ${isQuarantined ? `
                        <button onclick="restoreDevice('${id}')" class="mt-3 w-full py-1.5 px-3 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded border border-slate-600 text-slate-200 transition-colors">
                            Restore Node
                        </button>
                    ` : ''}
                `;
                container.appendChild(card);
            });
        }

        async function restoreDevice(deviceId) {
            await fetch(`/api/v1/devices/${deviceId}/reset`, { method: "POST" });
            loadDevices();
        }

        function handleEvent(event) {
            const timeStr = new Date().toLocaleTimeString();

            if (event.type === "TELEMETRY_ACCEPTED") {
                const container = document.getElementById("telemetry-logs");
                const item = document.createElement("div");
                item.className = "p-2.5 rounded bg-slate-900/60 border border-slate-800";
                item.innerHTML = `
                    <div class="text-xs text-slate-400 mb-1">
                        <span>[${timeStr}]</span> 
                        <span class="text-emerald-400 font-bold">${event.device_id}</span> | 
                        Entropy: <span class="text-amber-400 font-semibold">${Number(event.entropy).toFixed(2)}</span>
                    </div>
                    <div class="text-[11px] text-slate-300 truncate">${JSON.stringify(event.data)}</div>
                `;
                container.prepend(item);
            } else if (event.type === "SECURITY_ALERT") {
                const alertContainer = document.getElementById("alert-logs");
                const noAlerts = document.getElementById("no-alerts");
                if (noAlerts) noAlerts.remove();

                const alertItem = document.createElement("div");
                alertItem.className = "p-3 rounded bg-rose-950/30 border border-rose-700 text-rose-200";
                alertItem.innerHTML = `
                    <div class="font-bold text-xs text-rose-400 mb-1">
                        [${timeStr}] ${event.device_id}: ${event.reason}
                    </div>
                    <div class="text-xs text-rose-300 leading-snug">${event.details}</div>
                `;
                alertContainer.prepend(alertItem);

                const telemContainer = document.getElementById("telemetry-logs");
                const blockedItem = document.createElement("div");
                blockedItem.className = "p-2.5 rounded bg-rose-950/40 border border-rose-600/60 text-rose-200";
                blockedItem.innerHTML = `
                    <div class="text-xs mb-1 font-bold">
                        <span>[${timeStr}]</span> 
                        <span class="text-rose-400">${event.device_id}</span> | 
                        <span class="text-amber-300 font-mono">ANOMALY DETECTED</span>
                    </div>
                    <div class="text-[11px] text-rose-300 leading-snug truncate">${event.details}</div>
                `;
                telemContainer.prepend(blockedItem);

                loadDevices();
            } else if (event.type === "DEVICE_RESTORED") {
                loadDevices();
            }
        }

        connect();
    </script>
</body>
</html>
